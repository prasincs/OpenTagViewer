<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home Find pairing</title><link rel="stylesheet" href="/pairing-ui.css"><script defer src="/pairing-ui.js"></script></head>
<body><main><h1>Connect your Android phone</h1><p>In OpenTagViewer, tap <strong>Scan Mac QR code</strong>.</p><p id="status" role="status" aria-live="polite">Connecting to the Mac pairing service…</p><div id="qr" aria-label="Phone pairing QR code"></div><p id="expiry"></p><p id="apple" role="status"></p><button id="cancel" type="button">Cancel pairing</button><p class="note">Codes refresh automatically while this window waits. Only scan into your own phone. Keep both devices connected to Tailscale.</p><p id="restart" hidden>Open pair-phone.command on your Mac to start again.</p></main></body></html>
